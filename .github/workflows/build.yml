name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Godot e Android
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/godot/export_templates"
          mkdir -p "$DEST" "$HOME/.config/godot"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          if [ ! -d "$SDK" ]; then
            CMDLINE_TOOLS_DIR="$(find / -maxdepth 4 -type d -name cmdline-tools 2>/dev/null | head -n 1 || true)"
            if [ -n "$CMDLINE_TOOLS_DIR" ]; then
              SDK="$(dirname "$CMDLINE_TOOLS_DIR")"
            fi
          fi
          echo "Android SDK: $SDK"
          test -d "$SDK"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"

          JAVAC="$(command -v javac)"
          JDK="$(dirname "$(dirname "$(readlink -f "$JAVAC")")")"
          echo "JDK: $JDK"
          test -x "$JDK/bin/javac"
          test -x "$JDK/bin/jarsigner"
          export JAVA_HOME="$JDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          test -x "$SDKMANAGER"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          ls -la "$SDK/platform-tools/adb" "$SDK/build-tools/34.0.0" "$SDK/platforms/android-34"

          TEMPLATE_SRC="/root/.local/share/godot/export_templates/4.3.stable"
          TEMPLATE_DEST="$DEST/4.3.stable"
          if [ ! -d "$TEMPLATE_DEST" ] && [ -d "$TEMPLATE_SRC" ]; then
            cp -r "$TEMPLATE_SRC" "$DEST/"
          fi
          ls -la "$TEMPLATE_DEST"
          test -f "$TEMPLATE_DEST/android_debug.apk"
          test -f "$TEMPLATE_DEST/android_source.zip"

          if [ ! -f "$HOME/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
              -keystore "$HOME/debug.keystore" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          fi
          ls -la "$HOME/debug.keystore"

          godot --headless -e --quit || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          sed -i '/^export\/android\//d' "$SETTINGS"
          if ! grep -q '^\[resource\]' "$SETTINGS"; then
            printf '\n[resource]\n' >> "$SETTINGS"
          fi
          {
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JDK\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/shutdown_adb_on_exit = true'
          } >> "$SETTINGS"
          echo '=== Final editor settings ==='
          cat "$SETTINGS"

      - name: Diagnosticar ambiente Android e Godot
        run: |
          echo '=== Java ==='
          java -version 2>&1 || true
          echo "JAVA_HOME=${JAVA_HOME:-}"
          echo '=== Android SDK paths ==='
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          for path in /usr/lib/android-sdk /usr/lib/android-sdk/cmdline-tools /usr/lib/android-sdk/platform-tools /usr/lib/android-sdk/build-tools /usr/lib/android-sdk/platforms; do
            echo "--- $path"
            ls -la "$path" 2>&1 || true
          done
          echo '=== Export templates ==='
          ls -la "$HOME/.local/share/godot/export_templates" 2>&1 || true
          ls -la "$HOME/.local/share/godot/export_templates/4.3.stable" 2>&1 || true
          echo '=== Editor settings ==='
          for settings in "$HOME"/.config/godot/editor_settings-*.tres; do
            [ -f "$settings" ] || continue
            echo "--- $settings"
            cat "$settings"
          done
          echo '=== Debug keystore ==='
          ls -la "$HOME/debug.keystore" 2>&1 || true
          echo '=== Project import ==='
          ls -la .godot 2>&1 || true

      - name: Exportar APK
        run: |
          set -o pipefail
          mkdir -p build
          set +e
          godot --headless --verbose --export-debug "Android" build/modelador3d.apk 2>&1 | tee export.log
          EXPORT_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo '=== Configuration error context ==='
            grep -n -i -B3 -A25 'configuration errors' export.log || true
          fi
          exit "$EXPORT_STATUS"

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: export.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: modelador3d-apk
          path: build/modelador3d.apk
