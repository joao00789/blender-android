name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Godot e Android
        run: |
          DEST=~/.local/share/godot/export_templates
          mkdir -p "$DEST" ~/.config/godot
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable "$DEST/"
          fi

          # keystore de debug
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore ~/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

          # Garante os componentes exatos exigidos pelo preset Android do Godot 4.3.
          SDK_ROOT=/usr/lib/android-sdk
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado no container"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" "build-tools;33.0.2" "platforms;android-33"

          # Gera o arquivo de configurações do editor e acrescenta as do Android
          godot --headless -e --quit || true
          F=$(ls ~/.config/godot/editor_settings-*.tres 2>/dev/null | head -1)
          if [ -z "$F" ]; then
            F=~/.config/godot/editor_settings-4.3.tres
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$F"
          fi
          JAVA_HOME="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")}" 
          {
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/shutdown_adb_on_exit = true'
          } >> "$F"

      - name: Exportar APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/modelador3d.apk

      - uses: actions/upload-artifact@v4
        with:
          name: modelador3d-apk
          path: build/modelador3d.apk
